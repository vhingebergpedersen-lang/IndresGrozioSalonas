<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turplan · Prototype til planlægning af personbefordring</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <div class="logo"><span class="logo-mark">T</span>Turplan</div>
  <nav class="roles" id="roles">
    <button data-act="role" data-role="office" class="active">🖥 Kørselskontor</button>
    <button data-act="role" data-role="inst">🏫 Institution</button>
    <button data-act="role" data-role="op">🚐 Vognmand</button>
    <button data-act="role" data-role="citizen">📱 Borgerapp</button>
    <button data-act="role" data-role="driver">🛞 Chaufførapp</button>
  </nav>
  <div class="clock">
    <input type="date" id="dateInput" data-chg="date" title="Kørselsdato">
    <button class="clock-btn" data-act="play" id="playBtn" title="Afspil dagen">▶</button>
    <span class="clock-time" id="clockTime">06:00</span>
    <input type="range" id="clockSlider" min="330" max="1080" step="1" data-chg="clock" title="Simuleret klokkeslæt">
    <select id="clockSpeed" data-chg="clockSpeed" title="Hastighed">
      <option value="1">1 min/s</option><option value="2">2 min/s</option><option value="5">5 min/s</option><option value="10">10 min/s</option>
    </select>
  </div>
</header>

<!-- ============ KØRSELSKONTOR ============ -->
<section class="role active" id="role-office">
  <nav class="subnav" id="officeNav">
    <button data-act="view" data-view="overview" class="active">Overblik</button>
    <button data-act="view" data-view="plan">Planlægning</button>
    <button data-act="view" data-view="citizens">Borgere &amp; bevillinger</button>
    <button data-act="view" data-view="institutions">Institutioner</button>
    <button data-act="view" data-view="operators">Vognmænd &amp; køretøjer</button>
    <button data-act="view" data-view="events">Afvigelser <span class="badge" id="evBadge"></span></button>
    <button data-act="view" data-view="scenarios">Scenarier</button>
    <button data-act="view" data-view="settings">Indstillinger</button>
  </nav>
  <div class="office-body">
    <div class="view page active" id="v-overview"></div>
    <div class="view planner" id="v-plan">
      <aside class="sidebar" id="planSide"></aside>
      <div class="map-wrap"><div id="map"></div><div class="map-legend" id="mapLegend"></div></div>
    </div>
    <div class="view page" id="v-citizens"></div>
    <div class="view page" id="v-institutions"></div>
    <div class="view page" id="v-operators"></div>
    <div class="view page" id="v-events"></div>
    <div class="view page" id="v-scenarios"></div>
    <div class="view page" id="v-settings"></div>
  </div>
</section>

<!-- ============ INSTITUTION ============ -->
<section class="role page" id="role-inst"></section>

<!-- ============ VOGNMAND ============ -->
<section class="role page" id="role-op"></section>

<!-- ============ BORGERAPP ============ -->
<section class="role phone-stage" id="role-citizen"></section>

<!-- ============ CHAUFFØRAPP ============ -->
<section class="role phone-stage" id="role-driver"></section>

<div class="toast" id="toast"></div>

<script src="js/util.js"></script>
<script src="js/demo.js"></script>
<script src="js/store.js"></script>
<script src="js/optimizer.js"></script>
<script src="js/office.js"></script>
<script src="js/portals.js"></script>
<script src="js/main.js"></script>
</body>
</html>
